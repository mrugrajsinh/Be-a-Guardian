# One-click setup for Render.com ("New +" -> "Blueprint" -> pick this repository).
services:
  - type: web
    name: be-a-guardian
    runtime: node
    plan: starter            # paid plan: stays awake 24x7 and allows a disk. Free plans sleep, which would miss alerts.
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    disk:
      name: be-a-guardian-data
      mountPath: /var/data   # accounts and alerts are stored here so they survive restarts
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: APP_NAME
        value: Be a Guardian
      - key: NODE_VERSION
        value: "20"
      - key: ADMIN_KEY       # Render will ask you to type this in. Choose a long password.
        sync: false
